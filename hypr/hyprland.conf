
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/themes/current/hyprland.conf

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=eDP-1,preferred,-250x1050,1
monitor=desc:Hewlett Packard HP LP2275w CNC8250G1W,1680x1050@59.95,1680x-355, 1, transform, 1
monitor=desc:DLOGIC Ltd. No Monitor USB_433f-4551,1680x1050@59.95,1680x-355, 1, transform, 1
monitor=desc:Hewlett Packard HP LP2275w CNC8250G1V,1680x1050@59.95,0x0,1 
monitor=desc: Dell Inc. DELL U2725QE 6N26484,preferred,auto,1.5 
monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun 
$notes = obsidian


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = mako
exec-once = systemctl --user start hyprpolkitagent
exec-once = xdg-desktop-portal-hyprland
exec-once = waybar & hyprpaper 
exec-once = kanshi
exec-once = syncthing --no-browser
exec-once = /usr/lib/kdeconnectd 


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORM, wayland
env = QT_QUICK_CONTROLS_SYTLE, org.kde.desktop
env = KDE_COLOR_SCHEME, BreezeDark


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us, il, de
    kb_variant =
    kb_model =
    kb_options = caps:super, grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
	scroll_factor = 0.4
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gestures {
    workspace = unset
}

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, V, togglesplit, # dwindle
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod, BackSpace, exec, ~/.config/hypr/scripts/switch_wallpaper.sh
bind = $mainMod, F, fullscreen
bind = $mainMod, B, exec, ~/.config/hypr/scripts/gaps_toogle.sh
bind = $mainMod, Q, exec, hyprlock

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
#bind = $mainMod, left, movefocus, l
#bind = $mainMod, right, movefocus, r
#bind = $mainMod, up, movefocus, u
#bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move windows with keyboard
bind = $mainMod SHIFT, h, movewindow, l 
bind = $mainMod SHIFT, j, movewindow, d 
bind = $mainMod SHIFT, k, movewindow, u 
bind = $mainMod SHIFT, l, movewindow, r 

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Should try hyprshot
bind = ,Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -

#commands for apps
bind = $mainMod, O, exec, $notes
bind = $mainMod, F10, exec, $terminal -e btop

# Rofi apps
bind = $mainMod, D, exec, ~/.config/rofi/scripts/zathura_open.bash

# Switch to a submap called `resize`.
bind = ALT, R, submap, resize

# Start a submap called "resize".
submap = resize

# Set repeatable binds for resizing the active window.
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10

# Use `reset` to go back to the global submap
bind = , escape, submap, reset

# Reset the submap, which will return to the global submap
submap = reset

# Keybinds further down will be global again...
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# workspace = 1, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 2, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 3, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 4, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 5, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 6, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 7, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 8, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 9, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true
# workspace = 10, monitor:desc:Hewlett Packard HP LP2275w CNC8250G1V, default:true

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Make pavucontrol always float
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
# Make Menu TUI's float (impala, bluetui...)
windowrulev2 = float, class:^(menu.tui)$
windowrulev2 = size 800 600, class:^(menu.tui)$
# Make Firefox picture-in-picture window float
windowrulev2 = float, title:^(Picture-in-Picture)$

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland 1, no_focus on, float on, fullscreen off, pin off

layerrule = blur on, match:namespace waybar
